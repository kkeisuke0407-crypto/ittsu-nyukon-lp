<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>移動しています｜一通入魂</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FAF7F2;color:#1D1410;font:500 15px/1.8 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;text-align:center}
  main{padding:24px 16px}
  a{color:#C23A1E}
</style>
<script>
/* お客様のチラシのQRコード用の転送ページ。
   チラシのQRは https://ittsu.navolio.net/r/?c=目印 にして、ここで読み取りを1回数えてから、お客様のページへ移る。
   - 目印は英小文字・数字・-・_ の20文字まで（例：a01-a / a01-b）。集計の「経路」にこの目印で出る（stats.html）。
   - 送り比べるときは、同じ転送先に -a・-b の2つの目印を作る。
   - 転送先はここに登録したURLだけ。登録のない目印はトップに案内する（知らないサイトへは飛ばさない）。
   - 追加したら公開リポジトリへ反映する。 */
const LINKS = {
  // 'a01-a': 'https://example.co.jp/contact/',
};
(() => {
  const API = 'https://script.google.com/macros/s/AKfycbxBJRm_ohJWD63o2AXTjYe5XmsFrlkCXiPk_2QnOeM6-oOwxNugMeikpqdvQPATlssT/exec';
  const code = (new URLSearchParams(location.search).get('c') || '').toLowerCase();
  const to = /^[a-z0-9_-]{1,20}$/.test(code) && Object.prototype.hasOwnProperty.call(LINKS, code) ? LINKS[code] : '';
  window.ITTSU_R = { code, to };
  if (!to) return;
  let test = false;
  try { test = localStorage.getItem('ittsu_nocount') === '1'; } catch (e) { /* 保存できない端末はそのまま */ }
  if (!test && !navigator.webdriver) {
    let first = 1;
    try {
      const key = 'ittsu_r_' + code, today = new Date().toLocaleDateString('sv');
      first = localStorage.getItem(key) === today ? 0 : 1;
      localStorage.setItem(key, today);
    } catch (e) { /* 保存できない端末は毎回1人として数える */ }
    const body = JSON.stringify({ kind: 'hit', ev: 'pv', src: code, u: first });
    try {
      if (!(navigator.sendBeacon && navigator.sendBeacon(API, body))) {
        fetch(API, { method: 'POST', body, keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' } }).catch(() => {});
      }
    } catch (e) { /* 数えられなくても移動は止めない */ }
  }
  location.replace(to);
})();
</script>
</head>
<body>
<main id="msg">
  <p>移動しています…</p>
</main>
<script>
  const m = document.getElementById('msg');
  if (window.ITTSU_R && window.ITTSU_R.to) {
    m.innerHTML = '<p>移動しています…</p><p><a id="go">自動で移動しない場合はこちら</a></p>';
    document.getElementById('go').href = window.ITTSU_R.to;
  } else {
    document.title = '行き先が見つかりません｜一通入魂';
    m.innerHTML = '<p>このQRコードの行き先が見つかりませんでした。</p><p><a href="../">一通入魂のトップページへ</a></p>';
  }
</script>
</body>
</html>
