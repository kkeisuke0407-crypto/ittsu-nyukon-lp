<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="707" viewBox="0 0 1500 707"><rect x="0" y="0" width="1500" height="707" rx="0" fill="#fffefb"/><rect x="90" y="75" width="66" height="6" rx="0" fill="#7a3fa0"/><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="145">人事ご担当者さまへ。社員研修のまなびや研修です。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="215.2">現場で優秀だった人が、管理職になったとたんに悩み始める。面談が雑談で終わる、仕事</text><text x="90" y="261.4">を任せられない。私たちがいちばん多くいただくご相談です。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="331.59999999999997">この研修では、実際の部下との面談を練習しながら、管理職の型を身につけます。カリキ</text><text x="90" y="377.79999999999995">ュラムの資料を無料でお送りします。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="24" font-weight="700" fill="#7a3fa0"><text x="90" y="655">全部ひらくと、サービスと料金のご案内です。 ↓</text></g></svg>