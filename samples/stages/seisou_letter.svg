<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="707" viewBox="0 0 1500 707"><rect x="0" y="0" width="1500" height="707" rx="0" fill="#fffefb"/><rect x="90" y="75" width="66" height="6" rx="0" fill="#14a3c7"/><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="145">突然のお便り、失礼いたします。キララ・オフィス清掃です。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="215.2">掃除当番は一人15分でも、社員全員で毎週となると、かなりの時間になります。来客の</text><text x="90" y="261.4">前にトイレや給湯室が気になる、という声もよく聞きます。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="331.59999999999997">週1回、業務時間外に伺うだけで、その時間を仕事に回せます。お見積もりは無料です。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="24" font-weight="700" fill="#14a3c7"><text x="90" y="655">全部ひらくと、サービスと料金のご案内です。 ↓</text></g></svg>