<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="707" viewBox="0 0 1500 707"><rect x="0" y="0" width="1500" height="707" rx="0" fill="#fffefb"/><rect x="90" y="75" width="66" height="6" rx="0" fill="#2f5bea"/><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="145">総務ご担当者さまへ。勤怠管理クラウド「キントル」のご案内です。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="215.2">タイムカードの数字をExcelに打ち直し、残業を数えて、有休の残りを確かめる。月</text><text x="90" y="261.4">末のたびに、この作業で一日が終わってしまう。そんな声をよくいただきます。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="331.59999999999997">キントルなら、この集計がボタンひとつで終わります。30日間、無料でお試しいただけ</text><text x="90" y="377.79999999999995">ます。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="24" font-weight="700" fill="#2f5bea"><text x="90" y="655">全部ひらくと、サービスと料金のご案内です。 ↓</text></g></svg>