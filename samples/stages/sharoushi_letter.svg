<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="707" viewBox="0 0 1500 707"><rect x="0" y="0" width="1500" height="707" rx="0" fill="#fffefb"/><rect x="90" y="75" width="66" height="6" rx="0" fill="#e07a2e"/><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="145">突然のお便り、失礼いたします。ひだまり社労士事務所です。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="215.2">従業員を雇っている会社なら、使える助成金がいくつかあることがほとんどです。それで</text><text x="90" y="261.4">も「調べる時間がない」「書類が面倒」という理由で、受け取らないままの会社が少なく</text><text x="90" y="307.59999999999997">ありません。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="377.79999999999995">御社が対象になりそうかどうかは、30分ほどのお話でお伝えできます。費用はかかりま</text><text x="90" y="423.99999999999994">せん。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="24" font-weight="700" fill="#e07a2e"><text x="90" y="655">全部ひらくと、サービスと料金のご案内です。 ↓</text></g></svg>