<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="707" viewBox="0 0 1500 707"><rect x="0" y="0" width="1500" height="707" rx="0" fill="#fffefb"/><rect x="90" y="75" width="66" height="6" rx="0" fill="#1f6f5c"/><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="145">はじめまして。港区の会計事務所、あおば会計事務所です。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="215.2">創業して間もない社長から、いちばん多く聞くのが「経理に追われて、本業に集中できな</text><text x="90" y="261.4">い」という声です。領収書の整理も決算の準備も大事な仕事ですが、社長が自分でやらな</text><text x="90" y="307.59999999999997">くても大丈夫です。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="377.79999999999995">このチラシに、経理を任せると何が変わるのか、費用はいくらかかるのかをまとめました</text><text x="90" y="423.99999999999994">。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="24" font-weight="700" fill="#1f6f5c"><text x="90" y="655">全部ひらくと、サービスと料金のご案内です。 ↓</text></g></svg>