<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="707" viewBox="0 0 1500 707"><rect x="0" y="0" width="1500" height="707" rx="0" fill="#fffefb"/><rect x="90" y="75" width="66" height="6" rx="0" fill="#d35400"/><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="145">飲食店オーナーさまへ。業務用食材の卸、うまいもん卸です。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="215.2">野菜は八百屋、肉は精肉店、調味料は問屋。仕入れ先が多いほど、発注も支払いも手間が</text><text x="90" y="261.4">かかります。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="331.59999999999997">うまいもん卸なら、野菜から消耗品まで1社でまとめて注文できます。まずは無料のお試</text><text x="90" y="377.79999999999995">しセットで、味と鮮度をお確かめください。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="24" font-weight="700" fill="#d35400"><text x="90" y="655">全部ひらくと、サービスと料金のご案内です。 ↓</text></g></svg>