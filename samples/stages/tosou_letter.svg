<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="707" viewBox="0 0 1500 707"><rect x="0" y="0" width="1500" height="707" rx="0" fill="#fffefb"/><rect x="90" y="75" width="66" height="6" rx="0" fill="#c0392b"/><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="145">突然のお便り、失礼いたします。近くで外壁と屋根の塗装をしている、あかね塗装店です</text><text x="90" y="191.2">。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="261.4">築10年を過ぎると、外壁のひびや屋根の色あせが目立ってきます。小さなひびでも、放</text><text x="90" y="307.59999999999997">っておくと雨水がしみこみ、直す費用が大きくなります。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="377.79999999999995">ドローンを使った点検は無料です。屋根にのぼらずに、今の状態を写真でお見せします。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="24" font-weight="700" fill="#c0392b"><text x="90" y="655">全部ひらくと、サービスと料金のご案内です。 ↓</text></g></svg>