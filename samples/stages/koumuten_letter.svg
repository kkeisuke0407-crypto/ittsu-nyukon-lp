<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="707" viewBox="0 0 1500 707"><rect x="0" y="0" width="1500" height="707" rx="0" fill="#fffefb"/><rect x="90" y="75" width="66" height="6" rx="0" fill="#5b3b1f"/><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="145">はじめまして。地元で事務所や店舗の改装をしている、森の木工務店です。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="215.2">人が増えて机が足りない。お店の内装が古くなった。でも、営業を止めて工事をするのは</text><text x="90" y="261.4">難しい。そんなご相談を多くいただきます。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="331.59999999999997">私たちは、休業日や夜の時間を使って工事を進めます。図面がなくても、現地を見てお見</text><text x="90" y="377.79999999999995">積もりします。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="24" font-weight="700" fill="#5b3b1f"><text x="90" y="655">全部ひらくと、サービスと料金のご案内です。 ↓</text></g></svg>