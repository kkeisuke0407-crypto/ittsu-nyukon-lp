<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="707" viewBox="0 0 1500 707"><rect x="0" y="0" width="1500" height="707" rx="0" fill="#fffefb"/><rect x="90" y="75" width="66" height="6" rx="0" fill="#0f3d68"/><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="145">人事ご責任者さまへ。つなぎ人材エージェントです。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="215.2">エンジニアの採用は、求人を出して待つだけでは難しくなりました。経験のある人ほど、</text><text x="90" y="261.4">転職サイトに登録していないからです。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="500" fill="#39332e"><text x="90" y="331.59999999999997">私たちは、担当者が直接会って確かめた方だけをご紹介します。採用が決まるまで、費用</text><text x="90" y="377.79999999999995">はかかりません。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="24" font-weight="700" fill="#0f3d68"><text x="90" y="655">全部ひらくと、サービスと料金のご案内です。 ↓</text></g></svg>