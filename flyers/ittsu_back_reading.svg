<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 1500 2121"><rect x="0" y="0" width="1500" height="2121" rx="0" fill="#fffefb"/><rect x="0" y="0" width="1500" height="707" rx="0" fill="#f4efe8"/><rect x="88" y="77" width="70" height="8" rx="0" fill="#b9422c"/><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="35" font-weight="900" fill="#242323"><text x="90" y="140">一通入魂</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="70" font-weight="900" fill="#282320"><text x="90" y="284">その営業、</text><text x="90" y="386.9">社長まで届いていますか。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="27" font-weight="600" fill="#6b5d51"><text x="93" y="469">テレアポも営業メールも届かない相手へ。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="27" font-weight="700" fill="#b9422c"><text x="93" y="607">ひらいて、ご覧ください。 ↓</text></g><line x1="0" y1="707" x2="1500" y2="707" stroke="#d4c7bb" stroke-width="2"/><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="38" font-weight="900" fill="#b9422c"><text x="90" y="795">開けてもらうだけで、終わらせない。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="29" font-weight="500" fill="#3c3631"><text x="94" y="867">電話は受付で止まり、メールは読まれない。</text><text x="94" y="920.65">では、どうすれば社長の机に届けられるのか。</text><text x="94" y="974.3"></text><text x="94" y="1027.95">私たちが選んだのは、宛名を人の手で書いた封筒です。</text><text x="94" y="1081.6">でも、開けてもらえただけでは、相談にはつながりません。</text><text x="94" y="1135.25"></text><text x="94" y="1188.9">中には、悩み・解決策・料金を読み進められるLPチラシを。</text><text x="94" y="1242.55">開く順番に、伝える順番も設計します。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="26" font-weight="700" fill="#b9422c"><text x="94" y="1353">全部ひらくと、サービスと料金のご案内です。 ↓</text></g><line x1="0" y1="1414" x2="1500" y2="1414" stroke="#d4c7bb" stroke-width="2"/><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="40" font-weight="900" fill="#242323"><text x="90" y="1530">一通を、まとめてお任せください。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="30" font-weight="500" fill="#51473f"><text x="94" y="1618">送り先の相談から原稿づくり、デザイン、印刷。</text><text x="94" y="1672">宛名の手書きと封入、切手貼り、投函まで。</text><text x="94" y="1726">はじめての手書きDMも、一通入魂がお手伝いします。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="27" font-weight="700" fill="#b9422c"><text x="94" y="1845">A4縦・両面・上下に三つ折り。</text><text x="94" y="1893.6">100通からご相談いただけます。</text></g><g font-family="Yu Gothic,Meiryo,sans-serif" font-size="25" font-weight="700" fill="#242323"><text x="94" y="2047">一通入魂｜宛名は手書き、中身はLPチラシ。</text></g></svg>